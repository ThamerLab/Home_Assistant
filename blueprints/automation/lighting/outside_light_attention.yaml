blueprint:
  name: "💡 Outdoor Light — Abnormal State Alert"
  author: "ThamerLab"
  description: >
    Alerts when a selected outdoor light stays OFF while the sun is below the
    chosen elevation, or stays ON while the sun is above it, for the configured
    mismatch duration. The notification offers Fix and Keep actions with unique
    action identifiers generated from the automation context.
  domain: automation
  source_url: https://github.com/ThamerLab/Home_Assistant/blob/main/blueprints/automation/lighting/outside_light_attention.yaml
  homeassistant:
    min_version: "2026.9.4"

  input:
    outside_light:
      name: "💡 Outdoor Light"
      selector:
        entity:
          filter:
            domain: light

    sun_elevation:
      name: "☀️ Sun Elevation Threshold"
      default: 5
      selector:
        number:
          min: -10
          max: 20
          step: 0.5
          unit_of_measurement: "°"
          mode: slider

    mismatch_minutes:
      name: "⏱️ Mismatch Duration"
      description: How long the abnormal state must remain true before alerting.
      default: 30
      selector:
        number:
          min: 5
          max: 180
          step: 5
          unit_of_measurement: minutes
          mode: slider

    notification_tag:
      name: "🏷️ Notification Tag"
      description: Use a unique value if more than one instance alerts the same phone.
      default: "outside_light_attention"
      selector:
        text:

    notify_device:
      name: "📱 Device to Notify"
      selector:
        device:
          filter:
            integration: mobile_app

trigger_variables:
  trigger_light: !input outside_light
  trigger_elevation_limit: !input sun_elevation

variables:
  light_target: !input outside_light
  elevation_limit: !input sun_elevation
  notification_tag_value: !input notification_tag

triggers:
  - trigger: template
    value_template: >
      {% set elevation = state_attr('sun.sun', 'elevation') %}
      {% if elevation is none %}
        false
      {% else %}
        {{
          (
            elevation | float < trigger_elevation_limit | float
            and is_state(trigger_light, 'off')
          )
          or
          (
            elevation | float > trigger_elevation_limit | float
            and is_state(trigger_light, 'on')
          )
        }}
      {% endif %}
    for:
      minutes: !input mismatch_minutes
    id: mismatch

conditions: []

actions:
  - variables:
      action_fix: "{{ 'OUTSIDE_LIGHT_FIX_' ~ context.id }}"
      action_keep: "{{ 'OUTSIDE_LIGHT_KEEP_' ~ context.id }}"
      situation: >
        {% set elevation = state_attr('sun.sun', 'elevation') | float(0) %}
        {% if elevation < elevation_limit | float and is_state(light_target, 'off') %}
          night_off
        {% elif elevation > elevation_limit | float and is_state(light_target, 'on') %}
          day_on
        {% else %}
          resolved
        {% endif %}

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ situation == 'night_off' }}"
        sequence:
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "🌙 Outdoor light is OFF"
            message: "The outdoor light has remained OFF while it is night. Fix it?"
            data:
              tag: "{{ notification_tag_value }}"
              actions:
                - action: "{{ action_fix }}"
                  title: "💡 Turn it on"
                - action: "{{ action_keep }}"
                  title: "Keep it off"

      - conditions:
          - condition: template
            value_template: "{{ situation == 'day_on' }}"
        sequence:
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "☀️ Outdoor light is still ON"
            message: "The outdoor light has remained ON during the day. Fix it?"
            data:
              tag: "{{ notification_tag_value }}"
              actions:
                - action: "{{ action_fix }}"
                  title: "🔌 Turn it off"
                - action: "{{ action_keep }}"
                  title: "Keep it on"

    default:
      - stop: "Mismatch resolved before notification"

  - wait_for_trigger:
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: "{{ action_fix }}"
        id: fix

      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: "{{ action_keep }}"
        id: keep

      - trigger: template
        value_template: >
          {% set elevation = state_attr('sun.sun', 'elevation') | float(0) %}
          {{
            not (
              (
                elevation < elevation_limit | float
                and is_state(light_target, 'off')
              )
              or
              (
                elevation > elevation_limit | float
                and is_state(light_target, 'on')
              )
            )
          }}
        id: resolved

    timeout: "06:00:00"
    continue_on_timeout: true

  - choose:
      - conditions:
          - condition: template
            value_template: >
              {{
                wait.completed
                and wait.trigger is not none
                and wait.trigger.id == 'fix'
                and situation == 'night_off'
                and state_attr('sun.sun', 'elevation') | float(0) < elevation_limit | float
                and is_state(light_target, 'off')
              }}
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input outside_light

      - conditions:
          - condition: template
            value_template: >
              {{
                wait.completed
                and wait.trigger is not none
                and wait.trigger.id == 'fix'
                and situation == 'day_on'
                and state_attr('sun.sun', 'elevation') | float(0) > elevation_limit | float
                and is_state(light_target, 'on')
              }}
        sequence:
          - action: light.turn_off
            target:
              entity_id: !input outside_light

  - device_id: !input notify_device
    domain: mobile_app
    type: notify
    message: clear_notification
    data:
      tag: "{{ notification_tag_value }}"

mode: single
max_exceeded: silent
