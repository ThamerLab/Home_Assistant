blueprint:
  name: "🌙 Outdoor Lights — Dusk to Dawn"
  description: >
    Turn an outdoor light on when the sun elevation drops below the selected
    threshold and off when it rises above it. The automation retries once if
    the light does not respond. Manual changes are respected after the crossing
    event; there is no startup force-sync.
  domain: automation
  source_url: https://github.com/ThamerLab/Home_Assistant/blob/main/blueprints/automation/lighting/outside_lights_dusk_dawn.yaml

  input:
    outside_light:
      name: "💡 Outdoor Light"
      selector:
        entity:
          filter:
            domain: light

    sun_elevation:
      name: "☀️ Sun Elevation Threshold"
      description: >
        Light turns on below this value and off above it.
      default: 5
      selector:
        number:
          min: -10
          max: 20
          step: 0.5
          unit_of_measurement: "°"
          mode: slider

variables:
  light_target: !input outside_light

triggers:
  - trigger: numeric_state
    entity_id: sun.sun
    attribute: elevation
    below: !input sun_elevation
    id: dusk

  - trigger: numeric_state
    entity_id: sun.sun
    attribute: elevation
    above: !input sun_elevation
    id: dawn

conditions: []

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: dusk
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input outside_light
          - wait_template: "{{ is_state(light_target, 'on') }}"
            timeout: "00:00:10"
            continue_on_timeout: true
          - if:
              - condition: template
                value_template: "{{ not is_state(light_target, 'on') }}"
            then:
              - delay: "00:00:05"
              - action: light.turn_on
                target:
                  entity_id: !input outside_light

      - conditions:
          - condition: trigger
            id: dawn
        sequence:
          - action: light.turn_off
            target:
              entity_id: !input outside_light
          - wait_template: "{{ is_state(light_target, 'off') }}"
            timeout: "00:00:10"
            continue_on_timeout: true
          - if:
              - condition: template
                value_template: "{{ not is_state(light_target, 'off') }}"
            then:
              - delay: "00:00:05"
              - action: light.turn_off
                target:
                  entity_id: !input outside_light

mode: single
max_exceeded: silent
