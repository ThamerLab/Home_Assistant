blueprint:
  name: "🌙 Outdoor Lights — Dusk to Dawn"
  author: "ThamerLab"
  description: >
    Turns an outdoor light ON when sun elevation crosses below the selected
    threshold and OFF when it crosses above it. Verifies the result, retries once
    after five seconds if needed, and reports a persistent/mobile failure only
    if the second attempt is still not confirmed. No startup force-sync is used,
    so manual changes are not immediately overridden after restart.
  domain: automation
  source_url: https://github.com/ThamerLab/Home_Assistant/blob/main/blueprints/automation/lighting/outside_lights_dusk_dawn.yaml
  homeassistant:
    min_version: "2024.10.0"

  input:
    outside_light:
      name: "💡 Outdoor Light"
      selector:
        entity:
          filter:
            domain: light

    sun_elevation:
      name: "☀️ Sun Elevation Threshold"
      description: Light turns ON below this value and OFF above it.
      default: 5
      selector:
        number:
          min: -10
          max: 20
          step: 0.5
          unit_of_measurement: "°"
          mode: slider

    notify_devices:
      name: "📱 Notification Devices"
      description: Optional Companion App devices used only if the light fails after the retry.
      default: []
      selector:
        device:
          filter:
            integration: mobile_app
          multiple: true

variables:
  light_target: !input outside_light
  notify_targets: !input notify_devices

triggers:
  - trigger: numeric_state
    entity_id: sun.sun
    attribute: elevation
    below: !input sun_elevation
    id: dusk

  - trigger: numeric_state
    entity_id: sun.sun
    attribute: elevation
    above: !input sun_elevation
    id: dawn

conditions: []

actions:
  - variables:
      desired_state: "{{ 'on' if trigger.id == 'dusk' else 'off' }}"
      desired_action: "{{ 'light.turn_on' if trigger.id == 'dusk' else 'light.turn_off' }}"

  - action: "{{ desired_action }}"
    target:
      entity_id: !input outside_light

  - wait_template: "{{ is_state(light_target, desired_state) }}"
    timeout: "00:00:10"
    continue_on_timeout: true

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ not wait.completed }}"
        sequence:
          - delay: "00:00:05"
          - action: "{{ desired_action }}"
            target:
              entity_id: !input outside_light
          - wait_template: "{{ is_state(light_target, desired_state) }}"
            timeout: "00:00:10"
            continue_on_timeout: true

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ not wait.completed }}"
                sequence:
                  - action: persistent_notification.create
                    data:
                      title: "⚠️ Outdoor light did not respond"
                      message: >
                        The automation tried twice to set {{ light_target }} to
                        {{ desired_state }}, but the final state was not confirmed.
                  - repeat:
                      for_each: "{{ notify_targets }}"
                      sequence:
                        - device_id: "{{ repeat.item }}"
                          domain: mobile_app
                          type: notify
                          title: "⚠️ Outdoor light did not respond"
                          message: >
                            Two attempts were made, but the outdoor light did not
                            report {{ desired_state }}.

mode: single
max_exceeded: silent
