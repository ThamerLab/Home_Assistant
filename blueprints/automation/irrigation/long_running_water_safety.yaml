blueprint:
  name: "🚨 Water Valves — Long Running Safety Watchdog"
  author: "ThamerLab"
  description: >
    Safety watchdog for water or irrigation switches. Alerts when any selected
    switch remains ON longer than the chosen threshold, offers Stop all or Keep
    running, verifies the reported OFF state after a stop command, and performs
    a periodic fallback check. Action identifiers are unique per run.
  domain: automation
  source_url: https://github.com/ThamerLab/Home_Assistant/blob/main/blueprints/automation/irrigation/long_running_water_safety.yaml
  homeassistant:
    min_version: "2026.9.4"

  input:
    water_switches:
      name: "💧 Water / Irrigation Switches"
      selector:
        entity:
          filter:
            domain: switch
          multiple: true

    long_run_minutes:
      name: "⏱️ Alert After"
      default: 10
      selector:
        number:
          min: 5
          max: 180
          step: 5
          unit_of_measurement: minutes
          mode: slider

    keep_minutes:
      name: "💧 Snooze After Keep Running"
      description: >
        When Keep running is selected, this automation stays busy for the chosen
        period. After it ends, the five-minute watchdog can alert again if needed.
      default: 30
      selector:
        number:
          min: 5
          max: 180
          step: 5
          unit_of_measurement: minutes
          mode: slider

    notification_tag:
      name: "🏷️ Notification Tag"
      description: >
        Use a unique value if you create more than one instance of this blueprint
        for the same phone.
      default: "long_running_water"
      selector:
        text:

    notify_device:
      name: "📱 Device to Notify"
      selector:
        device:
          filter:
            integration: mobile_app

variables:
  switches: !input water_switches
  threshold_minutes: !input long_run_minutes
  keep_running_minutes: !input keep_minutes
  notification_tag_value: !input notification_tag

triggers:
  - trigger: state
    entity_id: !input water_switches
    to: "on"
    for:
      minutes: !input long_run_minutes
    id: long_running

  - trigger: time_pattern
    minutes: "/5"
    id: watchdog

  - trigger: homeassistant
    event: start
    id: startup

conditions:
  - condition: template
    value_template: >
      {% if trigger.id == 'long_running' %}
        true
      {% else %}
        {% set ns = namespace(found=false) %}
        {% for item in expand(switches) %}
          {% if
            item.state == 'on'
            and
            (as_timestamp(now()) - as_timestamp(item.last_changed))
            >= (threshold_minutes | float(0) * 60)
          %}
            {% set ns.found = true %}
          {% endif %}
        {% endfor %}
        {{ ns.found }}
      {% endif %}

actions:
  - variables:
      action_stop: "{{ 'WATER_STOP_' ~ context.id }}"
      action_keep: "{{ 'WATER_KEEP_' ~ context.id }}"

  - device_id: !input notify_device
    domain: mobile_app
    type: notify
    title: "🚨 Water is still running"
    message: >
      {% set ns = namespace(lines=[]) %}
      {% for item in expand(switches) %}
        {% if item.state == 'on' %}
          {% set minutes = ((as_timestamp(now()) - as_timestamp(item.last_changed)) / 60) | round(0) %}
          {% set ns.lines = ns.lines + [item.name ~ ': about ' ~ minutes ~ ' min'] %}
        {% endif %}
      {% endfor %}
      {{ ns.lines | join('\n') }}

      Stop the water now?
    data:
      tag: "{{ notification_tag_value }}"
      push:
        sound:
          name: default
          critical: 1
          volume: 1.0
      actions:
        - action: "{{ action_stop }}"
          title: "🛑 Stop all"
          destructive: true
        - action: "{{ action_keep }}"
          title: "💧 Keep running"

  - wait_for_trigger:
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: "{{ action_stop }}"
        id: stop

      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: "{{ action_keep }}"
        id: keep

      - trigger: template
        value_template: >
          {{
            expand(switches)
            | rejectattr('state', 'eq', 'off')
            | list
            | count == 0
          }}
        id: all_off

    timeout: "00:05:00"
    continue_on_timeout: true

  - choose:
      - conditions:
          - condition: template
            value_template: >
              {{
                wait.completed
                and wait.trigger is not none
                and wait.trigger.id == 'stop'
              }}
        sequence:
          - action: switch.turn_off
            continue_on_error: true
            target:
              entity_id: !input water_switches

          - wait_template: >
              {{
                expand(switches)
                | rejectattr('state', 'eq', 'off')
                | list
                | count == 0
              }}
            timeout: "00:00:15"
            continue_on_timeout: true

          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            message: clear_notification
            data:
              tag: "{{ notification_tag_value }}"

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ wait.completed }}"
                sequence:
                  - device_id: !input notify_device
                    domain: mobile_app
                    type: notify
                    title: "✅ Water stopped"
                    message: "All selected water switches are confirmed OFF by Home Assistant."
            default:
              - device_id: !input notify_device
                domain: mobile_app
                type: notify
                title: "🚨 Could not confirm shutdown"
                message: >
                  The OFF command was sent, but one or more selected switches
                  did not report OFF within 15 seconds. Check the water system immediately.
                data:
                  tag: "{{ notification_tag_value }}_stop_failed"
                  push:
                    sound:
                      name: default
                      critical: 1
                      volume: 1.0

      - conditions:
          - condition: template
            value_template: >
              {{
                wait.completed
                and wait.trigger is not none
                and wait.trigger.id == 'keep'
              }}
        sequence:
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            message: clear_notification
            data:
              tag: "{{ notification_tag_value }}"

          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "💧 Water kept running"
            message: >
              Monitoring is snoozed for {{ keep_running_minutes }} minutes.
              If a selected switch is still ON afterwards, the watchdog can alert again.

          - delay:
              minutes: !input keep_minutes

      - conditions:
          - condition: template
            value_template: >
              {{
                wait.completed
                and wait.trigger is not none
                and wait.trigger.id == 'all_off'
              }}
        sequence:
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            message: clear_notification
            data:
              tag: "{{ notification_tag_value }}"

    default: []

mode: single
max_exceeded: silent
