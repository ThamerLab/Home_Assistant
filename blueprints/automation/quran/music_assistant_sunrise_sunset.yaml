blueprint:
  name: "📖 Quran via Music Assistant — Sunrise & Sunset"
  author: "ThamerLab"
  description: >
    Plays an exact Quran item from Music Assistant at sunrise and sunset.
    Targets only Music Assistant media_player entities, replaces the queue,
    verifies that the requested URI became the active item, and reports failure
    if playback cannot be confirmed within 30 seconds. It does not wait for the
    recitation to finish.
  domain: automation
  source_url: https://github.com/ThamerLab/Home_Assistant/blob/main/blueprints/automation/quran/music_assistant_sunrise_sunset.yaml
  homeassistant:
    min_version: "2024.10.0"

  input:
    quran_player:
      name: "🔊 Music Assistant Player"
      description: >
        Select the media_player entity created by the Music Assistant integration,
        not the native Apple TV / Google Cast entity.
      selector:
        entity:
          filter:
            - integration: music_assistant
              domain: media_player

    quran_uri:
      name: "📚 Exact Music Assistant URI"
      description: >
        Exact Music Assistant URI for the Quran item, for example
        library://track/151. Get this URI from Music Assistant Provider Details
        or the Home Assistant Music Assistant actions.
      selector:
        text:

    media_type:
      name: "🎵 Media Type"
      default: track
      selector:
        select:
          options:
            - track
            - album
            - playlist
            - radio

    notify_devices:
      name: "📱 Notification Devices"
      description: Optional Home Assistant Companion App devices.
      default: []
      selector:
        device:
          filter:
            integration: mobile_app
          multiple: true

variables:
  player: !input quran_player
  uri: !input quran_uri
  notify_targets: !input notify_devices

triggers:
  - trigger: sun
    event: sunrise
    id: sunrise

  - trigger: sun
    event: sunset
    id: sunset

conditions: []

actions:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ states(player) in ['unavailable', 'unknown'] }}"
        sequence:
          - repeat:
              for_each: "{{ notify_targets }}"
              sequence:
                - device_id: "{{ repeat.item }}"
                  domain: mobile_app
                  type: notify
                  title: "⚠️ Quran playback unavailable"
                  message: "The selected Music Assistant player is {{ states(player) }}."
          - action: persistent_notification.create
            data:
              title: "⚠️ Quran playback unavailable"
              message: "Music Assistant player {{ player }} is {{ states(player) }}."
          - stop: "Music Assistant player unavailable"

  - action: music_assistant.play_media
    continue_on_error: true
    target:
      entity_id: !input quran_player
    data:
      media_id: !input quran_uri
      media_type: !input media_type
      enqueue: replace

  - wait_template: >
      {{
        is_state(player, 'playing')
        and state_attr(player, 'media_content_id') == uri
      }}
    timeout: "00:00:30"
    continue_on_timeout: true

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ wait.completed }}"
        sequence:
          - repeat:
              for_each: "{{ notify_targets }}"
              sequence:
                - device_id: "{{ repeat.item }}"
                  domain: mobile_app
                  type: notify
                  title: "📖 Quran playback started"
                  message: >
                    {% if trigger.id == 'sunrise' %}
                      Sunrise playback started successfully.
                    {% else %}
                      Sunset playback started successfully.
                    {% endif %}
    default:
      - repeat:
          for_each: "{{ notify_targets }}"
          sequence:
            - device_id: "{{ repeat.item }}"
              domain: mobile_app
              type: notify
              title: "⚠️ Quran playback failed"
              message: >
                Music Assistant did not confirm the requested URI within 30 seconds.
                Player state: {{ states(player) }}.
      - action: persistent_notification.create
        data:
          title: "⚠️ Quran playback failed"
          message: >
            Player: {{ player }}
            Requested URI: {{ uri }}
            State: {{ states(player) }}
            Current item: {{ state_attr(player, 'media_content_id') }}

mode: single
max_exceeded: silent
