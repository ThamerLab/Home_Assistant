blueprint:
  name: "🚿 Bathroom Occupancy — Lights & Exhaust Fan"
  author: "ThamerLab"
  description: >
    Self-contained bathroom automation with no helper entities required.
    Supports multiple occupancy sensors, independent light/fan ON and OFF
    delays, optional automatic startup, forgotten-device safety timeouts,
    startup reconciliation, and ON/OFF state verification.
  domain: automation
  source_url: https://github.com/ThamerLab/Home_Assistant/blob/main/blueprints/automation/bathroom/bathroom_occupancy_lights_fan.yaml
  homeassistant:
    min_version: "2026.9.4"

  input:
    occupancy_sensors:
      name: "🚶 Occupancy / Motion Sensors"
      description: >
        Select one or more binary sensors. Any selected sensor ON means the
        bathroom is occupied. The bathroom is considered vacant only when every
        selected sensor is OFF. Unknown or unavailable sensors prevent automatic
        vacancy shutdown.
      selector:
        entity:
          filter:
            domain: binary_sensor
          multiple: true

    lights_to_control:
      name: "💡 Bathroom Lights"
      description: >
        Select the bathroom lights controlled by this Blueprint.
      selector:
        entity:
          filter:
            domain: light
          multiple: true

    fan_entities:
      name: "🌀 Exhaust Fan"
      description: >
        Select exhaust-fan targets. Both fan and switch domains are supported,
        including relay-controlled bathroom fans.
      selector:
        entity:
          filter:
            - domain: fan
            - domain: switch
          multiple: true

    auto_turn_on_lights:
      name: "💡 Automatically Turn On Lights"
      description: >
        Turn the selected lights ON automatically when occupancy starts.
      default: true
      selector:
        boolean:

    auto_turn_on_fan:
      name: "🌀 Automatically Turn On Fan"
      description: >
        Turn the selected exhaust fan ON automatically when occupancy starts.
      default: true
      selector:
        boolean:

    light_on_delay:
      name: "💡 Light ON Delay"
      description: >
        Seconds occupancy must remain active before lights are turned ON.
        Use 0 for immediate lighting.
      default: 0
      selector:
        number:
          min: 0
          max: 900
          step: 5
          unit_of_measurement: seconds
          mode: slider

    fan_on_delay:
      name: "🌀 Fan ON Delay"
      description: >
        Seconds occupancy must remain active before the fan is turned ON.
        Use 0 for immediate ventilation or a longer delay to ignore short visits.
      default: 0
      selector:
        number:
          min: 0
          max: 1800
          step: 10
          unit_of_measurement: seconds
          mode: slider

    light_off_delay:
      name: "💡 Light OFF Delay"
      description: >
        Seconds the bathroom must remain fully vacant before the selected lights
        are turned OFF.
      default: 90
      selector:
        number:
          min: 0
          max: 3600
          step: 5
          unit_of_measurement: seconds
          mode: slider

    fan_off_delay:
      name: "🌀 Fan OFF Delay"
      description: >
        Seconds the bathroom must remain fully vacant before the selected fan
        targets are turned OFF.
      default: 420
      selector:
        number:
          min: 0
          max: 7200
          step: 10
          unit_of_measurement: seconds
          mode: slider

    enable_vacant_light_safety:
      name: "🛡️ Forgotten Light Safety"
      description: >
        If lights are turned ON while the bathroom is already vacant, turn them
        OFF after the configurable safety timeout unless occupancy returns.
      default: true
      selector:
        boolean:

    vacant_light_safety_timeout:
      name: "⏳ Forgotten Light Safety Timeout"
      description: >
        Maximum time lights may remain ON continuously while the bathroom is
        vacant before the safety shutdown.
      default: 1800
      selector:
        number:
          min: 60
          max: 14400
          step: 60
          unit_of_measurement: seconds
          mode: slider

    enable_vacant_fan_safety:
      name: "🛡️ Forgotten Fan Safety"
      description: >
        If the fan is turned ON while the bathroom is already vacant, turn it
        OFF after the configurable safety timeout unless occupancy returns.
      default: true
      selector:
        boolean:

    vacant_fan_safety_timeout:
      name: "⏳ Forgotten Fan Safety Timeout"
      description: >
        Maximum time fan targets may remain ON continuously while the bathroom
        is vacant before the safety shutdown.
      default: 3600
      selector:
        number:
          min: 60
          max: 14400
          step: 60
          unit_of_measurement: seconds
          mode: slider

    startup_verify_seconds:
      name: "✅ Startup Verification"
      description: >
        Maximum time allowed for an automatic ON command to be confirmed by
        Home Assistant.
      default: 10
      selector:
        number:
          min: 3
          max: 60
          step: 1
          unit_of_measurement: seconds
          mode: slider

    shutdown_verify_seconds:
      name: "✅ Shutdown Verification"
      description: >
        Maximum time allowed for an OFF command to be confirmed by Home Assistant.
      default: 15
      selector:
        number:
          min: 3
          max: 60
          step: 1
          unit_of_measurement: seconds
          mode: slider

    startup_reconcile_delay:
      name: "🔄 Home Assistant Startup Reconcile Delay"
      description: >
        Seconds to wait after Home Assistant starts before checking a fully vacant
        bathroom and restoring automatic OFF protection.
      default: 30
      selector:
        number:
          min: 0
          max: 300
          step: 5
          unit_of_measurement: seconds
          mode: slider

trigger_variables:
  trigger_occupancy_entities: !input occupancy_sensors
  trigger_light_entities: !input lights_to_control
  trigger_fan_targets: !input fan_entities
  trigger_light_safety_enabled: !input enable_vacant_light_safety
  trigger_fan_safety_enabled: !input enable_vacant_fan_safety

variables:
  occupancy_entities: !input occupancy_sensors
  light_entities: !input lights_to_control
  fan_targets: !input fan_entities
  light_auto_on: !input auto_turn_on_lights
  fan_auto_on: !input auto_turn_on_fan
  start_verify: !input startup_verify_seconds
  stop_verify: !input shutdown_verify_seconds

triggers:
  - trigger: template
    value_template: >
      {{
        expand(trigger_occupancy_entities)
        | selectattr('state', 'eq', 'on')
        | list
        | count > 0
      }}
    id: occupied

  - trigger: template
    value_template: >
      {{
        expand(trigger_occupancy_entities)
        | rejectattr('state', 'eq', 'off')
        | list
        | count == 0
      }}
    id: vacant

  - trigger: template
    value_template: >
      {{
        trigger_light_safety_enabled
        and
        (
          expand(trigger_occupancy_entities)
          | rejectattr('state', 'eq', 'off')
          | list
          | count == 0
        )
        and
        (
          expand(trigger_light_entities)
          | selectattr('state', 'eq', 'on')
          | list
          | count > 0
        )
      }}
    for:
      seconds: !input vacant_light_safety_timeout
    id: forgotten_light

  - trigger: template
    value_template: >
      {{
        trigger_fan_safety_enabled
        and
        (
          expand(trigger_occupancy_entities)
          | rejectattr('state', 'eq', 'off')
          | list
          | count == 0
        )
        and
        (
          expand(trigger_fan_targets)
          | selectattr('state', 'eq', 'on')
          | list
          | count > 0
        )
      }}
    for:
      seconds: !input vacant_fan_safety_timeout
    id: forgotten_fan

  - trigger: homeassistant
    event: start
    id: startup_reconcile

conditions: []

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: occupied
        sequence:
          - parallel:
              - sequence:
                  - condition: template
                    value_template: "{{ light_auto_on }}"

                  - delay:
                      seconds: !input light_on_delay

                  - condition: template
                    value_template: >
                      {{
                        expand(occupancy_entities)
                        | selectattr('state', 'eq', 'on')
                        | list
                        | count > 0
                      }}

                  - action: light.turn_on
                    target:
                      entity_id: !input lights_to_control

                  - wait_template: >
                      {{
                        expand(light_entities)
                        | rejectattr('state', 'eq', 'on')
                        | list
                        | count == 0
                      }}
                    timeout:
                      seconds: "{{ start_verify | int }}"
                    continue_on_timeout: true

                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ not wait.completed }}"
                        sequence:
                          - action: persistent_notification.create
                            data:
                              title: "Bathroom light startup not confirmed"
                              message: >
                                The bathroom automation sent ON to the selected
                                lights, but not every light reported ON within
                                {{ start_verify }} seconds.

              - sequence:
                  - condition: template
                    value_template: "{{ fan_auto_on }}"

                  - delay:
                      seconds: !input fan_on_delay

                  - condition: template
                    value_template: >
                      {{
                        expand(occupancy_entities)
                        | selectattr('state', 'eq', 'on')
                        | list
                        | count > 0
                      }}

                  - action: homeassistant.turn_on
                    target:
                      entity_id: !input fan_entities

                  - wait_template: >
                      {{
                        expand(fan_targets)
                        | rejectattr('state', 'eq', 'on')
                        | list
                        | count == 0
                      }}
                    timeout:
                      seconds: "{{ start_verify | int }}"
                    continue_on_timeout: true

                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ not wait.completed }}"
                        sequence:
                          - action: persistent_notification.create
                            data:
                              title: "Bathroom fan startup not confirmed"
                              message: >
                                The bathroom automation sent ON to the selected fan
                                targets, but not every target reported ON within
                                {{ start_verify }} seconds.

      - conditions:
          - condition: trigger
            id: vacant
        sequence:
          - parallel:
              - sequence:
                  - delay:
                      seconds: !input light_off_delay

                  - condition: template
                    value_template: >
                      {{
                        expand(occupancy_entities)
                        | rejectattr('state', 'eq', 'off')
                        | list
                        | count == 0
                      }}

                  - condition: template
                    value_template: >
                      {{
                        expand(light_entities)
                        | selectattr('state', 'eq', 'on')
                        | list
                        | count > 0
                      }}

                  - action: light.turn_off
                    continue_on_error: true
                    target:
                      entity_id: !input lights_to_control

                  - wait_template: >
                      {{
                        expand(light_entities)
                        | rejectattr('state', 'eq', 'off')
                        | list
                        | count == 0
                      }}
                    timeout:
                      seconds: "{{ stop_verify | int }}"
                    continue_on_timeout: true

                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ not wait.completed }}"
                        sequence:
                          - action: persistent_notification.create
                            data:
                              title: "Bathroom light shutdown not confirmed"
                              message: >
                                The bathroom remained vacant and OFF was sent to
                                the selected lights, but not every light reported
                                OFF within {{ stop_verify }} seconds.

              - sequence:
                  - delay:
                      seconds: !input fan_off_delay

                  - condition: template
                    value_template: >
                      {{
                        expand(occupancy_entities)
                        | rejectattr('state', 'eq', 'off')
                        | list
                        | count == 0
                      }}

                  - condition: template
                    value_template: >
                      {{
                        expand(fan_targets)
                        | selectattr('state', 'eq', 'on')
                        | list
                        | count > 0
                      }}

                  - action: homeassistant.turn_off
                    continue_on_error: true
                    target:
                      entity_id: !input fan_entities

                  - wait_template: >
                      {{
                        expand(fan_targets)
                        | rejectattr('state', 'eq', 'off')
                        | list
                        | count == 0
                      }}
                    timeout:
                      seconds: "{{ stop_verify | int }}"
                    continue_on_timeout: true

                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ not wait.completed }}"
                        sequence:
                          - action: persistent_notification.create
                            data:
                              title: "Bathroom fan shutdown not confirmed"
                              message: >
                                The bathroom remained vacant and OFF was sent to
                                the selected fan targets, but not every target
                                reported OFF within {{ stop_verify }} seconds.

      - conditions:
          - condition: trigger
            id: forgotten_light
        sequence:
          - condition: template
            value_template: >
              {{
                expand(occupancy_entities)
                | rejectattr('state', 'eq', 'off')
                | list
                | count == 0
              }}

          - action: light.turn_off
            continue_on_error: true
            target:
              entity_id: !input lights_to_control

          - wait_template: >
              {{
                expand(light_entities)
                | rejectattr('state', 'eq', 'off')
                | list
                | count == 0
              }}
            timeout:
              seconds: "{{ stop_verify | int }}"
            continue_on_timeout: true

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ not wait.completed }}"
                sequence:
                  - action: persistent_notification.create
                    data:
                      title: "Forgotten bathroom light shutdown not confirmed"
                      message: >
                        The forgotten-light safety timeout expired while the
                        bathroom remained vacant, but not every selected light
                        confirmed OFF.

      - conditions:
          - condition: trigger
            id: forgotten_fan
        sequence:
          - condition: template
            value_template: >
              {{
                expand(occupancy_entities)
                | rejectattr('state', 'eq', 'off')
                | list
                | count == 0
              }}

          - action: homeassistant.turn_off
            continue_on_error: true
            target:
              entity_id: !input fan_entities

          - wait_template: >
              {{
                expand(fan_targets)
                | rejectattr('state', 'eq', 'off')
                | list
                | count == 0
              }}
            timeout:
              seconds: "{{ stop_verify | int }}"
            continue_on_timeout: true

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ not wait.completed }}"
                sequence:
                  - action: persistent_notification.create
                    data:
                      title: "Forgotten bathroom fan shutdown not confirmed"
                      message: >
                        The forgotten-fan safety timeout expired while the
                        bathroom remained vacant, but not every selected fan
                        target confirmed OFF.

      - conditions:
          - condition: trigger
            id: startup_reconcile
        sequence:
          - delay:
              seconds: !input startup_reconcile_delay

          - condition: template
            value_template: >
              {{
                expand(occupancy_entities)
                | rejectattr('state', 'eq', 'off')
                | list
                | count == 0
              }}

          - parallel:
              - sequence:
                  - delay:
                      seconds: !input light_off_delay

                  - condition: template
                    value_template: >
                      {{
                        expand(occupancy_entities)
                        | rejectattr('state', 'eq', 'off')
                        | list
                        | count == 0
                      }}

                  - action: light.turn_off
                    continue_on_error: true
                    target:
                      entity_id: !input lights_to_control

              - sequence:
                  - delay:
                      seconds: !input fan_off_delay

                  - condition: template
                    value_template: >
                      {{
                        expand(occupancy_entities)
                        | rejectattr('state', 'eq', 'off')
                        | list
                        | count == 0
                      }}

                  - action: homeassistant.turn_off
                    continue_on_error: true
                    target:
                      entity_id: !input fan_entities

mode: parallel
max: 20
max_exceeded: silent
