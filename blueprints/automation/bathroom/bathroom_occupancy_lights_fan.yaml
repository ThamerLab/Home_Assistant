blueprint:
  name: "🚿 Bathroom Occupancy — Lights & Exhaust Fan"
  author: "ThamerLab"
  description: >
    Self-contained bathroom automation with no helper entities required.
    Supports multiple occupancy sensors, independent light/fan ON and OFF
    delays, optional automatic startup, forgotten-device safety timeouts,
    startup reconciliation, and ON/OFF state verification.
  domain: automation
  source_url: https://github.com/ThamerLab/Home_Assistant/blob/main/blueprints/automation/bathroom/bathroom_occupancy_lights_fan.yaml
  homeassistant:
    min_version: "2026.9.4"

  input:
    occupancy_sensors:
      name: "🚶 Occupancy / Motion Sensors"
      description: >
        Select one or more binary sensors. Any selected sensor ON means the
        bathroom is occupied. The bathroom is considered vacant only when every
        selected sensor is OFF. Unknown or unavailable sensors prevent automatic
        vacancy shutdown.
      selector:
        entity:
          filter:
            domain: binary_sensor
          multiple: true

    lights_to_control:
      name: "💡 Bathroom Lights"
      description: "Select the bathroom lights controlled by this Blueprint."
      selector:
        entity:
          filter:
            domain: light
          multiple: true

    fan_entities:
      name: "🌀 Exhaust Fan"
      description: >
        Select exhaust-fan targets. Both fan and switch domains are supported,
        including relay-controlled bathroom fans.
      selector:
        entity:
          filter:
            - domain: fan
            - domain: switch
          multiple: true

    auto_turn_on_lights:
      name: "💡 Automatically Turn On Lights"
      default: true
      selector:
        boolean:

    auto_turn_on_fan:
      name: "🌀 Automatically Turn On Fan"
      default: true
      selector:
        boolean:

    light_on_delay:
      name: "💡 Light ON Delay"
      description: "Continuous occupancy required before lights are turned ON."
      default: 0
      selector:
        number:
          min: 0
          max: 900
          step: 5
          unit_of_measurement: seconds
          mode: slider

    fan_on_delay:
      name: "🌀 Fan ON Delay"
      description: "Continuous occupancy required before the fan is turned ON."
      default: 0
      selector:
        number:
          min: 0
          max: 1800
          step: 10
          unit_of_measurement: seconds
          mode: slider

    light_off_delay:
      name: "💡 Light OFF Delay"
      description: "Continuous full vacancy required before lights are turned OFF."
      default: 90
      selector:
        number:
          min: 0
          max: 3600
          step: 5
          unit_of_measurement: seconds
          mode: slider

    fan_off_delay:
      name: "🌀 Fan OFF Delay"
      description: "Continuous full vacancy required before the fan is turned OFF."
      default: 420
      selector:
        number:
          min: 0
          max: 7200
          step: 10
          unit_of_measurement: seconds
          mode: slider

    enable_vacant_light_safety:
      name: "🛡️ Forgotten Light Safety"
      description: >
        If lights are ON while the bathroom is already vacant, shut them down
        after the configurable safety timeout unless occupancy returns.
      default: true
      selector:
        boolean:

    vacant_light_safety_timeout:
      name: "⏳ Forgotten Light Safety Timeout"
      default: 1800
      selector:
        number:
          min: 60
          max: 14400
          step: 60
          unit_of_measurement: seconds
          mode: slider

    enable_vacant_fan_safety:
      name: "🛡️ Forgotten Fan Safety"
      description: >
        If the fan is ON while the bathroom is already vacant, shut it down
        after the configurable safety timeout unless occupancy returns.
      default: true
      selector:
        boolean:

    vacant_fan_safety_timeout:
      name: "⏳ Forgotten Fan Safety Timeout"
      default: 3600
      selector:
        number:
          min: 60
          max: 14400
          step: 60
          unit_of_measurement: seconds
          mode: slider

    startup_verify_seconds:
      name: "✅ Startup Verification"
      default: 10
      selector:
        number:
          min: 3
          max: 60
          step: 1
          unit_of_measurement: seconds
          mode: slider

    shutdown_verify_seconds:
      name: "✅ Shutdown Verification"
      default: 15
      selector:
        number:
          min: 3
          max: 60
          step: 1
          unit_of_measurement: seconds
          mode: slider

    startup_reconcile_delay:
      name: "🔄 Home Assistant Startup Reconcile Delay"
      description: >
        After Home Assistant starts, wait this many seconds. If the bathroom is
        still fully vacant, selected lights and fan targets are turned OFF.
      default: 30
      selector:
        number:
          min: 0
          max: 300
          step: 5
          unit_of_measurement: seconds
          mode: slider

trigger_variables:
  occupancy: !input occupancy_sensors
  lights: !input lights_to_control
  fans: !input fan_entities
  light_auto: !input auto_turn_on_lights
  fan_auto: !input auto_turn_on_fan
  light_safety: !input enable_vacant_light_safety
  fan_safety: !input enable_vacant_fan_safety

variables:
  occupancy_entities: !input occupancy_sensors
  light_entities: !input lights_to_control
  fan_targets: !input fan_entities
  start_verify: !input startup_verify_seconds
  stop_verify: !input shutdown_verify_seconds

triggers:
  - trigger: template
    value_template: >
      {{
        light_auto
        and
        (
          expand(occupancy)
          | selectattr('state', 'eq', 'on')
          | list
          | count > 0
        )
      }}
    for:
      seconds: !input light_on_delay
    id: light_on_ready

  - trigger: template
    value_template: >
      {{
        fan_auto
        and
        (
          expand(occupancy)
          | selectattr('state', 'eq', 'on')
          | list
          | count > 0
        )
      }}
    for:
      seconds: !input fan_on_delay
    id: fan_on_ready

  - trigger: template
    value_template: >
      {{
        expand(occupancy)
        | rejectattr('state', 'eq', 'off')
        | list
        | count == 0
      }}
    for:
      seconds: !input light_off_delay
    id: light_off_ready

  - trigger: template
    value_template: >
      {{
        expand(occupancy)
        | rejectattr('state', 'eq', 'off')
        | list
        | count == 0
      }}
    for:
      seconds: !input fan_off_delay
    id: fan_off_ready

  - trigger: template
    value_template: >
      {{
        light_safety
        and
        (
          expand(occupancy)
          | rejectattr('state', 'eq', 'off')
          | list
          | count == 0
        )
        and
        (
          expand(lights)
          | selectattr('state', 'eq', 'on')
          | list
          | count > 0
        )
      }}
    for:
      seconds: !input vacant_light_safety_timeout
    id: forgotten_light

  - trigger: template
    value_template: >
      {{
        fan_safety
        and
        (
          expand(occupancy)
          | rejectattr('state', 'eq', 'off')
          | list
          | count == 0
        )
        and
        (
          expand(fans)
          | selectattr('state', 'eq', 'on')
          | list
          | count > 0
        )
      }}
    for:
      seconds: !input vacant_fan_safety_timeout
    id: forgotten_fan

  - trigger: homeassistant
    event: start
    id: startup_reconcile

conditions: []

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: light_on_ready
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input lights_to_control

          - wait_template: >
              {{
                expand(light_entities)
                | rejectattr('state', 'eq', 'on')
                | list
                | count == 0
              }}
            timeout:
              seconds: "{{ start_verify | int }}"
            continue_on_timeout: true

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ not wait.completed }}"
                sequence:
                  - action: persistent_notification.create
                    data:
                      title: "Bathroom light startup not confirmed"
                      message: >
                        ON was sent to the selected bathroom lights, but not every
                        light reported ON within {{ start_verify }} seconds.

      - conditions:
          - condition: trigger
            id: fan_on_ready
        sequence:
          - action: homeassistant.turn_on
            target:
              entity_id: !input fan_entities

          - wait_template: >
              {{
                expand(fan_targets)
                | rejectattr('state', 'eq', 'on')
                | list
                | count == 0
              }}
            timeout:
              seconds: "{{ start_verify | int }}"
            continue_on_timeout: true

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ not wait.completed }}"
                sequence:
                  - action: persistent_notification.create
                    data:
                      title: "Bathroom fan startup not confirmed"
                      message: >
                        ON was sent to the selected bathroom fan targets, but not
                        every target reported ON within {{ start_verify }} seconds.

      - conditions:
          - condition: trigger
            id:
              - light_off_ready
              - forgotten_light
        sequence:
          - condition: template
            value_template: >
              {{
                expand(occupancy_entities)
                | rejectattr('state', 'eq', 'off')
                | list
                | count == 0
              }}

          - action: light.turn_off
            continue_on_error: true
            target:
              entity_id: !input lights_to_control

          - wait_template: >
              {{
                expand(light_entities)
                | rejectattr('state', 'eq', 'off')
                | list
                | count == 0
              }}
            timeout:
              seconds: "{{ stop_verify | int }}"
            continue_on_timeout: true

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ not wait.completed }}"
                sequence:
                  - action: persistent_notification.create
                    data:
                      title: "Bathroom light shutdown not confirmed"
                      message: >
                        OFF was sent while the bathroom was vacant, but not every
                        selected light reported OFF within {{ stop_verify }} seconds.

      - conditions:
          - condition: trigger
            id:
              - fan_off_ready
              - forgotten_fan
        sequence:
          - condition: template
            value_template: >
              {{
                expand(occupancy_entities)
                | rejectattr('state', 'eq', 'off')
                | list
                | count == 0
              }}

          - action: homeassistant.turn_off
            continue_on_error: true
            target:
              entity_id: !input fan_entities

          - wait_template: >
              {{
                expand(fan_targets)
                | rejectattr('state', 'eq', 'off')
                | list
                | count == 0
              }}
            timeout:
              seconds: "{{ stop_verify | int }}"
            continue_on_timeout: true

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ not wait.completed }}"
                sequence:
                  - action: persistent_notification.create
                    data:
                      title: "Bathroom fan shutdown not confirmed"
                      message: >
                        OFF was sent while the bathroom was vacant, but not every
                        selected fan target reported OFF within
                        {{ stop_verify }} seconds.

      - conditions:
          - condition: trigger
            id: startup_reconcile
        sequence:
          - delay:
              seconds: !input startup_reconcile_delay

          - condition: template
            value_template: >
              {{
                expand(occupancy_entities)
                | rejectattr('state', 'eq', 'off')
                | list
                | count == 0
              }}

          - parallel:
              - sequence:
                  - action: light.turn_off
                    continue_on_error: true
                    target:
                      entity_id: !input lights_to_control
              - sequence:
                  - action: homeassistant.turn_off
                    continue_on_error: true
                    target:
                      entity_id: !input fan_entities

mode: parallel
max: 10
max_exceeded: silent
