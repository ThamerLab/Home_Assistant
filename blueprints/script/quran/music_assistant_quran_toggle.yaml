blueprint:
  name: "📖 Quran via Music Assistant — Safe Toggle"
  author: "ThamerLab"
  description: >
    Reusable Quran playback script for a Music Assistant player. If the exact
    requested URI is playing, the script stops it and verifies that playback
    stopped. If the same URI is paused, it resumes and verifies playback. For
    any other state or item, it replaces the Music Assistant queue with the
    requested URI and verifies that the exact URI became active.
  domain: script
  source_url: https://github.com/ThamerLab/Home_Assistant/blob/main/blueprints/script/quran/music_assistant_quran_toggle.yaml
  homeassistant:
    min_version: "2024.10.0"

  input:
    quran_player:
      name: "🔊 Music Assistant Player"
      description: Select a media_player provided by the Music Assistant integration.
      selector:
        entity:
          filter:
            - integration: music_assistant
              domain: media_player

    quran_uri:
      name: "📚 Exact Music Assistant URI"
      description: Exact URI such as library://track/151.
      selector:
        text:

    media_type:
      name: "🎵 Media Type"
      default: track
      selector:
        select:
          options:
            - track
            - album
            - playlist
            - radio

    notify_devices:
      name: "📱 Notification Devices"
      description: Optional devices used for playback failure notifications.
      default: []
      selector:
        device:
          filter:
            integration: mobile_app
          multiple: true

variables:
  player: !input quran_player
  uri: !input quran_uri
  notify_targets: !input notify_devices

mode: single
max_exceeded: silent

sequence:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ states(player) in ['unavailable', 'unknown'] }}"
        sequence:
          - repeat:
              for_each: "{{ notify_targets }}"
              sequence:
                - device_id: "{{ repeat.item }}"
                  domain: mobile_app
                  type: notify
                  title: "⚠️ Quran playback unavailable"
                  message: "The selected Music Assistant player is {{ states(player) }}."
          - action: persistent_notification.create
            data:
              title: "⚠️ Quran playback unavailable"
              message: "Music Assistant player {{ player }} is {{ states(player) }}."
          - stop: "Music Assistant player unavailable"

      - conditions:
          - condition: template
            value_template: >
              {{
                is_state(player, 'playing')
                and state_attr(player, 'media_content_id') == uri
              }}
        sequence:
          - action: media_player.media_stop
            continue_on_error: true
            target:
              entity_id: !input quran_player

          - wait_template: >
              {{
                not is_state(player, 'playing')
                or state_attr(player, 'media_content_id') != uri
              }}
            timeout: "00:00:15"
            continue_on_timeout: true

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ wait.completed }}"
                sequence:
                  - stop: "Requested Quran item stopped"

          - repeat:
              for_each: "{{ notify_targets }}"
              sequence:
                - device_id: "{{ repeat.item }}"
                  domain: mobile_app
                  type: notify
                  title: "⚠️ Quran stop failed"
                  message: "The player did not confirm that the requested Quran item stopped."
          - action: persistent_notification.create
            data:
              title: "⚠️ Quran stop failed"
              message: >
                Player: {{ player }}
                Requested URI: {{ uri }}
                Current state: {{ states(player) }}
                Current item: {{ state_attr(player, 'media_content_id') }}
          - stop: "Requested Quran item did not stop"

      - conditions:
          - condition: template
            value_template: >
              {{
                is_state(player, 'paused')
                and state_attr(player, 'media_content_id') == uri
              }}
        sequence:
          - action: media_player.media_play
            continue_on_error: true
            target:
              entity_id: !input quran_player

          - wait_template: >
              {{
                is_state(player, 'playing')
                and state_attr(player, 'media_content_id') == uri
              }}
            timeout: "00:00:15"
            continue_on_timeout: true

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ wait.completed }}"
                sequence:
                  - stop: "Requested Quran item resumed"

          - repeat:
              for_each: "{{ notify_targets }}"
              sequence:
                - device_id: "{{ repeat.item }}"
                  domain: mobile_app
                  type: notify
                  title: "⚠️ Quran resume failed"
                  message: "Playback did not resume within 15 seconds."
          - action: persistent_notification.create
            data:
              title: "⚠️ Quran resume failed"
              message: >
                Player: {{ player }}
                Requested URI: {{ uri }}
                Current state: {{ states(player) }}
                Current item: {{ state_attr(player, 'media_content_id') }}
          - stop: "Requested Quran item did not resume"

    default:
      - action: music_assistant.play_media
        continue_on_error: true
        target:
          entity_id: !input quran_player
        data:
          media_id: !input quran_uri
          media_type: !input media_type
          enqueue: replace

      - wait_template: >
          {{
            is_state(player, 'playing')
            and state_attr(player, 'media_content_id') == uri
          }}
        timeout: "00:00:30"
        continue_on_timeout: true

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ wait.completed }}"
            sequence:
              - stop: "Requested Quran item started"

      - repeat:
          for_each: "{{ notify_targets }}"
          sequence:
            - device_id: "{{ repeat.item }}"
              domain: mobile_app
              type: notify
              title: "⚠️ Quran playback failed"
              message: >
                Music Assistant did not confirm the requested URI within 30 seconds.
                State: {{ states(player) }}.
      - action: persistent_notification.create
        data:
          title: "⚠️ Quran playback failed"
          message: >
            Player: {{ player }}
            Requested URI: {{ uri }}
            State: {{ states(player) }}
            Current item: {{ state_attr(player, 'media_content_id') }}
