<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Smart Irrigation Blueprint</title>
  <desc id="desc">Illustration for irrigation automation, flow monitoring, scheduling, and notifications.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B2942"/><stop offset="1" stop-color="#0A6B64"/></linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8DE3FF"/><stop offset="1" stop-color="#41BDF5"/></linearGradient>
  </defs>
  <rect width="900" height="360" rx="30" fill="url(#bg)"/>
  <text x="54" y="68" fill="#9CDFFF" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">THAMERLAB BLUEPRINT</text>
  <text x="54" y="120" fill="#FFF" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="800">Smart Irrigation</text>
  <text x="54" y="160" fill="#D5EAF2" font-family="Arial, Helvetica, sans-serif" font-size="20">Sunrise • Sunset • Custom schedule • Flow protection</text>
  <g transform="translate(55 205)">
    <rect width="180" height="54" rx="27" fill="#41BDF5" opacity=".16" stroke="#41BDF5" stroke-opacity=".6"/>
    <text x="90" y="35" text-anchor="middle" fill="#E7F8FF" font-family="Arial" font-size="17" font-weight="700">Flow monitoring</text>
    <rect x="195" width="170" height="54" rx="27" fill="#10B981" opacity=".16" stroke="#10B981" stroke-opacity=".6"/>
    <text x="280" y="35" text-anchor="middle" fill="#EDFFF8" font-family="Arial" font-size="17" font-weight="700">No-flow safety</text>
    <rect x="380" width="180" height="54" rx="27" fill="#FFF" opacity=".08" stroke="#FFF" stroke-opacity=".22"/>
    <text x="470" y="35" text-anchor="middle" fill="#FFF" font-family="Arial" font-size="17" font-weight="700">Notifications</text>
  </g>
  <g transform="translate(700 82)">
    <path d="M78 0C45 50 9 89 9 134a69 69 0 0 0 138 0C147 89 111 50 78 0Z" fill="url(#drop)"/>
    <path d="M52 147c13 18 35 24 55 13" fill="none" stroke="#FFF" stroke-opacity=".75" stroke-width="8" stroke-linecap="round"/>
    <path d="M-12 205c31-25 61-25 92 0 31-25 61-25 92 0" fill="none" stroke="#10B981" stroke-width="11" stroke-linecap="round"/>
  </g>
